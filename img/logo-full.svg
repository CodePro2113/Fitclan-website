<svg viewBox="0 0 180 56" xmlns="http://www.w3.org/2000/svg">
  <!--
    FitClan — Horizontal Logo (transparent background)
    Stepped figure mark + "FitClan" wordmark
    180×56 viewBox · use on dark backgrounds
  -->

  <!--
    Figure: scale(0.649) · translate(-7,1)
    Raw figure spans x:16–74 (58px wide), y:4–78 (74px tall).
    After transform:
      left edge  = 16×0.649 − 7 = 3.4px  (left padding)
      right edge = 74×0.649 − 7 = 41px
      top        = 4×0.649  + 1 = 3.6px
      bottom     = 78×0.649 + 1 = 51.6px (≈48px tall, centered in 56)
  -->
  <g transform="translate(-7,1) scale(0.649)"
     stroke="hsl(159,93%,50%)"
     stroke-width="5"
     stroke-linecap="square"
     stroke-linejoin="miter"
     fill="none">

    <rect x="40" y="4" width="16" height="16"/>
    <rect x="40" y="24" width="16" height="24"/>
    <polyline points="56,30 66,30 66,18 74,18"/>
    <polyline points="40,30 28,30 28,42 16,42"/>
    <polyline points="56,48 56,62 70,62 70,78"/>
    <polyline points="40,48 40,62 26,62 26,78"/>

  </g>

  <!--
    Wordmark: x=49 starts 8px after the figure right edge (41px).
    dominant-baseline="middle" + y=28 centers on the 56px canvas.
    Space Grotesk loaded by the site; Inter + system-ui as fallback.
  -->
  <text x="49" y="28"
        dominant-baseline="middle"
        font-family="'Space Grotesk', Inter, system-ui, sans-serif"
        font-weight="700"
        font-size="26"
        letter-spacing="-0.3"
        fill="white">FitClan</text>

</svg>
