<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in — FitClan</title>
  <meta name="description" content="Sign in to your FitClan account." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --teal: hsl(159, 93%, 50%);
      --blue: hsl(217, 91%, 60%);
      --bg:   hsl(240, 3%, 7%);
      --bg2:  hsl(240, 3%, 10%);
      --bg3:  hsl(240, 3%, 13%);
      --text: hsl(0, 0%, 96%);
      --muted: hsl(0, 0%, 55%);
      --border: hsl(240, 3%, 20%);
      --red: hsl(0, 72%, 60%);
      --font-head: 'Space Grotesk', sans-serif;
      --font-body: 'Inter', sans-serif;
    }
    html, body { min-height: 100vh; }
    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
    }
    a { color: inherit; text-decoration: none; }

    /* ── Orbs ── */
    .orb {
      position: fixed; border-radius: 50%;
      pointer-events: none; z-index: 0; will-change: transform;
    }
    .orb-1 {
      width: 700px; height: 700px;
      background: radial-gradient(circle, hsl(159,93%,50%,0.22) 0%, transparent 65%);
      top: -280px; right: -180px;
      filter: blur(110px);
      animation: orbDrift 28s ease-in-out infinite;
    }
    .orb-2 {
      width: 560px; height: 560px;
      background: radial-gradient(circle, hsl(217,91%,60%,0.18) 0%, transparent 65%);
      bottom: -160px; left: -160px;
      filter: blur(110px);
      animation: orbDrift 22s ease-in-out infinite -8s;
    }
    @keyframes orbDrift {
      0%,100% { transform: translate3d(0,0,0) scale(1); }
      50%     { transform: translate3d(30px,-40px,0) scale(1.06); }
    }
    @media (prefers-reduced-motion: reduce) { .orb { animation: none; } }

    /* ── Nav ── */
    nav {
      position: relative; z-index: 10;
      display: flex; align-items: center; justify-content: space-between;
      padding: 1.25rem 2rem;
      border-bottom: 1px solid var(--border);
    }
    .logo { display: flex; align-items: center; gap: 0.55rem; }
    .logo-text {
      font-family: var(--font-head); font-weight: 700; font-size: 1.15rem;
      background: linear-gradient(135deg, var(--teal), var(--blue));
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .nav-right { font-size: 0.85rem; color: var(--muted); }
    .nav-right a { color: var(--teal); font-weight: 600; margin-left: 4px; }
    .nav-right a:hover { text-decoration: underline; }

    /* ── Page ── */
    .page {
      flex: 1; display: flex; align-items: center; justify-content: center;
      padding: 2rem 1.25rem;
      position: relative; z-index: 2;
    }
    .card {
      width: 100%; max-width: 440px;
      background: hsl(240,3%,10%,0.7);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 2.5rem;
      backdrop-filter: blur(20px);
    }
    .card-title {
      font-family: var(--font-head);
      font-size: 1.75rem; font-weight: 700;
      margin-bottom: 0.4rem;
    }
    .card-sub { color: var(--muted); font-size: 0.9rem; margin-bottom: 2rem; }

    /* ── Form ── */
    .field { margin-bottom: 1rem; }
    label { display: block; font-size: 0.8rem; font-weight: 600; color: var(--muted); margin-bottom: 0.4rem; }
    .input-wrap { position: relative; }
    .input-wrap svg {
      position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
      width: 16px; height: 16px; color: var(--muted);
      pointer-events: none; transition: color .2s;
    }
    input[type="email"], input[type="password"], input[type="text"] {
      width: 100%; padding: 0.875rem 1rem 0.875rem 2.75rem;
      background: var(--bg3); border: 1px solid var(--border);
      border-radius: 14px; color: var(--text); font-size: 0.95rem;
      font-family: var(--font-body); outline: none;
      transition: border-color .2s;
    }
    input:focus { border-color: var(--teal); }
    input:focus + svg, .input-wrap:focus-within svg { color: var(--teal); }
    .input-wrap svg { order: -1; }
    .input-wrap { display: flex; align-items: center; }
    .input-wrap input { flex: 1; }
    .toggle-pw {
      position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer; padding: 2px;
      color: var(--muted); transition: color .2s;
    }
    .toggle-pw:hover { color: var(--text); }

    .forgot { text-align: right; margin-bottom: 1.5rem; }
    .forgot a { font-size: 0.8rem; color: var(--muted); transition: color .2s; }
    .forgot a:hover { color: var(--text); }

    /* ── Error ── */
    .error-msg {
      background: hsl(0,72%,60%,0.1); border: 1px solid hsl(0,72%,60%,0.3);
      color: hsl(0,72%,70%); border-radius: 10px;
      padding: 0.75rem 1rem; font-size: 0.85rem;
      margin-bottom: 1rem; display: none;
    }
    .error-msg.show { display: block; }

    /* ── Button ── */
    .btn-primary {
      display: flex; align-items: center; justify-content: center; gap: 0.5rem;
      width: 100%; padding: 0.9rem 1.5rem;
      background: linear-gradient(135deg, var(--teal), hsl(170,90%,40%));
      color: hsl(240,3%,7%); font-family: var(--font-head);
      font-weight: 700; font-size: 0.95rem;
      border: none; border-radius: 50px; cursor: pointer;
      box-shadow: 0 0 24px hsl(159,93%,50%,0.3);
      transition: opacity .2s, transform .15s, box-shadow .2s;
    }
    .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); box-shadow: 0 0 36px hsl(159,93%,50%,0.4); }
    .btn-primary:active { transform: translateY(0); }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    .divider { text-align: center; color: var(--muted); font-size: 0.8rem; margin: 1.5rem 0; }
    .signup-link { text-align: center; color: var(--muted); font-size: 0.9rem; }
    .signup-link a { color: var(--teal); font-weight: 600; }
    .signup-link a:hover { text-decoration: underline; }

    /* ── Spinner ── */
    .spinner {
      width: 18px; height: 18px; border: 2px solid hsl(240,3%,7%,0.3);
      border-top-color: hsl(240,3%,7%); border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <nav>
    <a href="index.html" class="logo">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
        <defs>
          <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="hsl(159,93%,50%)"/>
            <stop offset="100%" stop-color="hsl(217,91%,60%)"/>
          </linearGradient>
        </defs>
        <path d="M12 2C12 2 7 7 7 12.5a5 5 0 0010 0C17 7 12 2 12 2z" fill="url(#g1)" opacity=".9"/>
        <path d="M12 8c0 0-2.5 3-2.5 4.5a2.5 2.5 0 005 0C14.5 11 12 8 12 8z" fill="white" opacity=".7"/>
      </svg>
      <span class="logo-text">FitClan</span>
    </a>
    <div class="nav-right">
      Don't have an account?<a href="signup.html">Sign up free</a>
    </div>
  </nav>

  <div class="page">
    <div class="card">
      <h1 class="card-title">Welcome back</h1>
      <p class="card-sub">Log in to see your clan's leaderboard</p>

      <div class="error-msg" id="errorMsg"></div>

      <form id="loginForm">
        <div class="field">
          <label for="email">Email</label>
          <div class="input-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
            </svg>
            <input type="email" id="email" placeholder="you@example.com" autocomplete="email" required />
          </div>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="input-wrap" style="position:relative;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="position:absolute;left:14px;z-index:1;pointer-events:none;">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            <input type="password" id="password" placeholder="Your password" autocomplete="current-password" required style="padding-right:2.75rem;" />
            <button type="button" class="toggle-pw" id="togglePw" aria-label="Show password">
              <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <div class="forgot"><a href="forgot-password.html">Forgot password?</a></div>

        <button type="submit" class="btn-primary" id="submitBtn">
          <span id="btnText">Log in</span>
        </button>
      </form>

      <div class="divider">──────────────────</div>
      <div class="signup-link">
        New to FitClan? <a href="signup.html">Create a free account →</a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script>
    const SUPABASE_URL = 'https://cujbjttoofjytezdwkyr.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_QFvM6cyt5vxcleN7M9_oAw_VVaz0bta';
    const { createClient } = supabase;
    const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

    // Redirect if already logged in
    sb.auth.getSession().then(({ data: { session } }) => {
      if (session) window.location.href = 'dashboard.html';
    });

    // Toggle password visibility
    const pwInput = document.getElementById('password');
    const eyeIcon = document.getElementById('eyeIcon');
    document.getElementById('togglePw').addEventListener('click', () => {
      const isText = pwInput.type === 'text';
      pwInput.type = isText ? 'password' : 'text';
      eyeIcon.innerHTML = isText
        ? '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>'
        : '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>';
    });

    // Login form
    const form = document.getElementById('loginForm');
    const errorMsg = document.getElementById('errorMsg');
    const submitBtn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');

    function setLoading(loading) {
      submitBtn.disabled = loading;
      btnText.innerHTML = loading
        ? '<div class="spinner"></div>'
        : 'Log in';
    }

    function showError(msg) {
      errorMsg.textContent = msg;
      errorMsg.classList.add('show');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.classList.remove('show');
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      if (!email || !password) return;

      setLoading(true);
      const { error } = await sb.auth.signInWithPassword({ email, password });
      setLoading(false);

      if (error) {
        showError(error.message === 'Invalid login credentials'
          ? 'Incorrect email or password. Please try again.'
          : error.message);
        return;
      }
      window.location.href = 'dashboard.html';
    });
  </script>
</body>
</html>
